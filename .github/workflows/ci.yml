name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Contract lint + direct tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install contract tooling
        run: pip install -r requirements.txt

      - name: Lint contracts
        run: |
          genvm-lint check contracts/obolus.py --json
          genvm-lint check examples/estate_planner_example.py --json

      - name: Direct-mode tests
        run: pytest tests/direct/ -v

  backend:
    name: Backend install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install --workspace backend

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install --workspace frontend
      - run: npm run build --workspace frontend
