# Fly.io app config for the Obolus backend. Deploy from the repo root:
#   flyctl deploy --config fly.toml --dockerfile backend/Dockerfile
app = "obolus-api"
primary_region = "iad"

[build]

[env]
  PORT = "4000"
  GENLAYER_NETWORK = "studionet"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
